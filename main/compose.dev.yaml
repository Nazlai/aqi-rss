services:
  redis:
    image: redis:latest
    restart: always
    env_file:
      - ./.env.redis
    command: /bin/sh -c "redis-server --maxmemory 100mb --maxmemory-policy allkeys-lru --loglevel warning --requirepass $$REDIS_HOST_PASSWORD"
    container_name: rss-aqi-redis
    volumes:
      - redis-data:/data

  backend:
    image: rss-aqi-backend-dev
    build: 
      context: .
      target: build-stage
      dockerfile: ./Dockerfile
    command: npm run dev
    volumes:
      - ./src:/app/src
      - ./nodemon.json:/app/nodemon.json
    ports:
      - "8080:8080"
    environment:
      - DEBUG=${DEBUG:-false}
    env_file: "./.env"

volumes:
  redis-data:
    driver: local